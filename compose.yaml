name: proxy-microservice
services:
  app:
    build: .
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql://proxy_service:${POSTGRES_PASSWORD:?Run python3 scripts/setup.py}@host.docker.internal:${POSTGRES_PORT:-5432}/proxy_service
      BIND_ADDR: 0.0.0.0:8080
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run python3 scripts/setup.py}
      PROXY_ENCRYPTION_KEY: ${PROXY_ENCRYPTION_KEY:?Run python3 scripts/setup.py}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped
