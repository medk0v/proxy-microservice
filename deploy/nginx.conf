server {
    listen 80;
    listen [::]:80;
    server_name prx.azimuthglobal.co;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://prx.azimuthglobal.co$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name prx.azimuthglobal.co;

    ssl_certificate /etc/letsencrypt/live/prx.azimuthglobal.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prx.azimuthglobal.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ProxyTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 4m;
    # Request query strings can contain proxy search terms. No access log for this site.
    access_log off;
    error_log /var/log/nginx/proxy-microservice.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
    }
}
